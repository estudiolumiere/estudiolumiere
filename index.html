<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudio Lumière · Catálogo</title>

<style>
body{
  font-family: Arial;
  background:#120720;
  color:white;
  text-align:center;
}

/* LOGIN */
#login-screen{
  position:fixed;
  inset:0;
  background:#120720;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.hidden{display:none;}

input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#D4006E;
  color:white;
  cursor:pointer;
}

/* ADMIN */
#admin-panel{
  padding:20px;
}

.card{
  background:white;
  color:black;
  padding:10px;
  margin:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <h2>Modo Propietario</h2>

  <input id="user" type="text" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Clave">

  <button onclick="login()">Ingresar</button>
  <p id="error" style="color:pink;"></p>
</div>

<!-- CATÁLOGO -->
<h1>Estudio Lumière</h1>

<div id="catalogo"></div>

<button onclick="mostrarLogin()">Propietario</button>

<!-- ADMIN -->
<div id="admin-panel" class="hidden">

  <h2>Panel Admin</h2>

  <button onclick="logout()">Cerrar sesión</button>

  <h3>Agregar producto</h3>

  <input id="nombre" placeholder="Nombre">
  <input id="precio" placeholder="Precio">

  <button onclick="agregarProducto()">Guardar</button>

  <div id="lista-admin"></div>

</div>

<script>
// 🔐 CREDENCIALES
const USER = "admin";
const PASS = "1234";

// 📦 PRODUCTOS
let productos = JSON.parse(localStorage.getItem("productos")) || [];

// LOGIN
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === USER && p === PASS){
    localStorage.setItem("owner", "true");
    iniciarAdmin();
  }else{
    document.getElementById("error").innerText = "Datos incorrectos";
  }
}

// MOSTRAR LOGIN
function mostrarLogin(){
  document.getElementById("login-screen").classList.remove("hidden");
}

// INICIAR ADMIN
function iniciarAdmin(){
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("admin-panel").classList.remove("hidden");
  renderAdmin();
}

// LOGOUT
function logout(){
  localStorage.removeItem("owner");
  location.reload();
}

// AGREGAR PRODUCTO
function agregarProducto(){
  let nombre = document.getElementById("nombre").value;
  let precio = document.getElementById("precio").value;

  if(nombre === "" || precio === ""){
    alert("Completar datos");
    return;
  }

  productos.push({nombre, precio});
  localStorage.setItem("productos", JSON.stringify(productos));

  document.getElementById("nombre").value = "";
  document.getElementById("precio").value = "";

  renderCatalogo();
  renderAdmin();
}

// ELIMINAR
function eliminar(index){
  productos.splice(index,1);
  localStorage.setItem("productos", JSON.stringify(productos));
  renderCatalogo();
  renderAdmin();
}

// RENDER CATÁLOGO
function renderCatalogo(){
  let cont = document.getElementById("catalogo");
  cont.innerHTML = "";

  productos.forEach(p=>{
    cont.innerHTML += `
      <div class="card">
        <strong>${p.nombre}</strong><br>
        $${p.precio}
      </div>
    `;
  });
}

// RENDER ADMIN
function renderAdmin(){
  let cont = document.getElementById("lista-admin");
  cont.innerHTML = "";

  productos.forEach((p,i)=>{
    cont.innerHTML += `
      <div>
        ${p.nombre} - $${p.precio}
        <button onclick="eliminar(${i})">X</button>
      </div>
    `;
  });
}

// AUTO LOGIN
window.onload = function(){
  renderCatalogo();

  if(localStorage.getItem("owner") === "true"){
    iniciarAdmin();
  }else{
    document.getElementById("login-screen").classList.add("hidden");
  }
}
</script>

</body>
</html>
